<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" rx="16" fill="#08090C"/>
  <rect x="0.5" y="0.5" width="799" height="479" rx="15.5" stroke="#1A202C" stroke-width="1"/>
  
  <circle cx="150" cy="170" r="140" fill="#FF3E00" opacity="0.09"/>
  <circle cx="680" cy="80" r="200" fill="#FF7700" opacity="0.04"/>

  <!-- Logo Mark -->
  
<g transform="translate(60, 52)">
  <rect x="0" y="0" width="120" height="120" rx="16" fill="#0F131A" stroke="#1E2734" stroke-width="1.5"/>
  <!-- Outer Ramp (Mach 3) -->
  <polygon points="30,88 42,32 54,32 42,88" fill="#1A222E" stroke="#8E9AA8" stroke-width="1.5"/>
  <!-- Middle Ramp (Mach 6) -->
  <polygon points="50,88 62,22 74,22 62,88" fill="#283547" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Forward Hypersonic Blade (Mach 10) -->
  <polygon points="70,88 82,12 94,12 82,88" fill="#FF3E00" stroke="#FF3E00" stroke-width="1.5"/>
  <!-- Supersonic Plasma Flow Bar traversing all 3 -->
  <line x1="18" y1="66" x2="102" y2="66" stroke="#FF7700" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="84" cy="66" r="4" fill="#FFFFFF"/>
</g>


  <!-- Wordmark in Ioskeley / Heavy style -->
  <text x="210" y="112" font-family="'Ioskeley Mono Term Heavy', 'Cabinet Grotesk', -apple-system, monospace" font-weight="900" font-size="46" letter-spacing="-0.03em" fill="#F8FAFC">SCRAMJET</text>
  <text x="472" y="98" font-family="'Anonymous', monospace" font-weight="700" font-size="11" letter-spacing="0.22em" fill="#FF3E00">HYPERSONIC PROPULSION</text>
  <text x="212" y="145" font-family="'Anonymous', monospace" font-weight="400" font-size="14" fill="#8E9AA8">Three staggered titanium compression blades traversed by an unchoked supersonic plasma flow bar.</text>

  <!-- Divider -->
  <line x1="60" y1="198" x2="740" y2="198" stroke="#1A202C" stroke-width="1"/>

  <!-- Color Palette Swatches -->
  <text x="60" y="232" font-family="'Anonymous', monospace" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.1em">OFFICIAL COLOR PALETTE</text>
  
  <g transform="translate(60, 252)">
    <rect width="120" height="56" rx="8" fill="#08090C" stroke="#1A202C"/>
    <text x="12" y="32" font-family="'Anonymous', monospace" font-size="12" font-weight="700" fill="#FFFFFF">#08090C</text>
    <text x="12" y="46" font-family="'Anonymous', monospace" font-size="9" fill="#64748B">Abyssal Void</text>

    <g transform="translate(132, 0)">
      <rect width="120" height="56" rx="8" fill="#FF3E00"/>
      <text x="12" y="32" font-family="'Anonymous', monospace" font-size="12" font-weight="700" fill="#0A0B0E">#FF3E00</text>
      <text x="12" y="46" font-family="'Anonymous', monospace" font-size="9" fill="#450A0A">Plasma Flare</text>
    </g>

    <g transform="translate(264, 0)">
      <rect width="120" height="56" rx="8" fill="#8E9AA8"/>
      <text x="12" y="32" font-family="'Anonymous', monospace" font-size="12" font-weight="700" fill="#0A0B0E">#8E9AA8</text>
      <text x="12" y="46" font-family="'Anonymous', monospace" font-size="9" fill="#1E293B">Aero Titanium</text>
    </g>

    <g transform="translate(396, 0)">
      <rect width="120" height="56" rx="8" fill="#1A202C" stroke="#2D3748"/>
      <text x="12" y="32" font-family="'Anonymous', monospace" font-size="12" font-weight="700" fill="#E2E8F0">#1A202C</text>
      <text x="12" y="46" font-family="'Anonymous', monospace" font-size="9" fill="#94A3B8">Shock Slate</text>
    </g>

    <g transform="translate(528, 0)">
      <rect width="152" height="56" rx="8" fill="#F8FAFC"/>
      <text x="12" y="32" font-family="'Anonymous', monospace" font-size="12" font-weight="700" fill="#0A0B0E">#F8FAFC</text>
      <text x="12" y="46" font-family="'Anonymous', monospace" font-size="9" fill="#64748B">Stark White</text>
    </g>
  </g>

  <!-- Live UI Specimen Box / Telemetry HUD in Anonymous -->
  <g transform="translate(60, 338)">
    <rect width="680" height="102" rx="10" fill="#0E1218" stroke="#1A202C"/>
    <circle cx="24" cy="24" r="5" fill="#EF4444" opacity="0.7"/>
    <circle cx="38" cy="24" r="5" fill="#F59E0B" opacity="0.7"/>
    <circle cx="52" cy="24" r="5" fill="#10B981" opacity="0.7"/>
    <text x="75" y="28" font-family="'Anonymous', monospace" font-size="11" fill="#64748B">scramjet-core // supersonic-combustor-daemon</text>
    <rect x="510" y="15" width="150" height="22" rx="4" fill="#FF3E00" fill-opacity="0.12" stroke="#FF3E00" stroke-opacity="0.4"/>
    <text x="585" y="30" font-family="'Anonymous', monospace" font-size="10" font-weight="700" fill="#FF3E00" text-anchor="middle">FLOW: MACH 8.4</text>

    <text x="24" y="65" font-family="'Anonymous', monospace" font-size="11" fill="#64748B">FLOW STATE</text>
    <text x="24" y="85" font-family="'Anonymous', monospace" font-size="13" font-weight="700" fill="#FFFFFF">SUPERSONIC CONTINUOUS</text>

    <text x="340" y="65" font-family="'Anonymous', monospace" font-size="11" fill="#64748B">INVENTORY RISK</text>
    <text x="340" y="85" font-family="'Anonymous', monospace" font-size="13" font-weight="700" fill="#FF3E00">0.00 SOL HELD</text>

    <text x="530" y="65" font-family="'Anonymous', monospace" font-size="11" fill="#64748B">PROTOCOL SPLIT</text>
    <text x="530" y="85" font-family="'Anonymous', monospace" font-size="13" font-weight="700" fill="#F8FAFC">3.5% DEDUCTION</text>
  </g>
